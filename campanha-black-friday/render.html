<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SparkFilmes — Criativos Black Friday</title>
    <style>
      :root {
        --pink: #ff2c58;
        --black: #08080a;
        --paper: #f1f0f0;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Arial Black", "Segoe UI", Arial, sans-serif; }

      .creative {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        isolation: isolate;
        background: var(--black);
        color: var(--paper);
      }

      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: var(--photo-position, center center);
        filter: saturate(.92) contrast(1.08) brightness(.82);
        z-index: -4;
      }

      .shade {
        position: absolute;
        inset: 0;
        z-index: -3;
        background:
          linear-gradient(90deg, rgba(5,5,7,.97) 0%, rgba(5,5,7,.83) 35%, rgba(5,5,7,.23) 72%, rgba(5,5,7,.08) 100%),
          linear-gradient(0deg, rgba(5,5,7,.95) 0%, transparent 38%, rgba(5,5,7,.46) 100%);
      }

      .pink-glow {
        position: absolute;
        z-index: -2;
        left: -17%;
        bottom: -12%;
        width: 72%;
        height: 35%;
        border-radius: 50%;
        background: rgba(255,44,88,.34);
        filter: blur(115px);
      }

      .frame {
        position: absolute;
        inset: 34px;
        border: 1px solid rgba(241,240,240,.19);
        border-radius: 28px;
        pointer-events: none;
      }

      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        width: 100px;
        height: 6px;
        background: var(--pink);
      }
      .frame::before { left: -1px; top: -1px; border-radius: 28px 0 10px 0; }
      .frame::after { right: -1px; bottom: -1px; border-radius: 10px 0 28px 0; }

      .topbar {
        position: absolute;
        left: 76px;
        right: 76px;
        top: 76px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
      }

      .brand {
        width: 224px;
        height: 58px;
        display: flex;
        align-items: center;
        padding: 8px 18px;
        background: rgba(241,240,240,.96);
        border-radius: 999px;
        box-shadow: 0 14px 35px rgba(0,0,0,.3);
      }
      .brand img { width: 100%; height: 100%; object-fit: contain; }

      .campaign {
        padding: 15px 21px 13px;
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 999px;
        background: rgba(8,8,10,.7);
        color: #fff;
        font-size: 18px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: .12em;
        white-space: nowrap;
      }
      .campaign b { color: var(--pink); }

      .content {
        position: absolute;
        left: 76px;
        width: 70%;
        top: 278px;
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 25px;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--pink);
        font-size: 20px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .kicker::before { content: ""; width: 54px; height: 5px; background: var(--pink); border-radius: 5px; }

      h1 {
        margin: 0;
        max-width: 750px;
        font-size: 76px;
        line-height: .98;
        letter-spacing: -.055em;
        text-transform: uppercase;
        text-wrap: balance;
        text-shadow: 0 8px 30px rgba(0,0,0,.4);
      }
      h1 em { color: var(--pink); font-style: normal; }

      .subhead {
        margin: 30px 0 0;
        max-width: 650px;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 29px;
        line-height: 1.24;
        font-weight: 600;
        text-shadow: 0 4px 18px rgba(0,0,0,.75);
      }

      .footer {
        position: absolute;
        left: 76px;
        right: 76px;
        bottom: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 15px;
        min-height: 70px;
        padding: 18px 26px;
        border-radius: 14px;
        background: var(--pink);
        color: white;
        font-size: 20px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: .055em;
        text-transform: uppercase;
        box-shadow: 0 14px 38px rgba(255,44,88,.28);
      }
      .cta::after { content: "→"; font-size: 29px; line-height: .7; }

      .site {
        font-family: "Segoe UI", Arial, sans-serif;
        color: rgba(255,255,255,.86);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: .02em;
      }

      .number {
        position: absolute;
        right: 60px;
        bottom: 170px;
        font-size: 146px;
        line-height: 1;
        color: rgba(255,255,255,.055);
        letter-spacing: -.08em;
      }

      body.feed .topbar { top: 62px; left: 62px; right: 62px; }
      body.feed .content { left: 62px; top: 245px; width: 75%; }
      body.feed h1 { font-size: 67px; max-width: 770px; }
      body.feed .subhead { font-size: 25px; max-width: 650px; margin-top: 24px; }
      body.feed .footer { left: 62px; right: 62px; bottom: 62px; }
      body.feed .cta { min-height: 60px; padding: 15px 21px; font-size: 17px; }
      body.feed .site { font-size: 18px; }
      body.feed .number { right: 50px; bottom: 135px; font-size: 120px; }
      body.feed .shade {
        background:
          linear-gradient(90deg, rgba(5,5,7,.97) 0%, rgba(5,5,7,.84) 40%, rgba(5,5,7,.21) 82%, rgba(5,5,7,.09) 100%),
          linear-gradient(0deg, rgba(5,5,7,.93) 0%, transparent 43%, rgba(5,5,7,.35) 100%);
      }

      body.story .topbar { top: 92px; }
      body.story .content { top: 365px; width: 78%; }
      body.story h1 { font-size: 82px; max-width: 800px; }
      body.story .subhead { font-size: 31px; max-width: 690px; }
      body.story .footer { bottom: 102px; }
      body.story .frame { inset: 42px; }

      body.variant-right .shade {
        background:
          linear-gradient(270deg, rgba(5,5,7,.96) 0%, rgba(5,5,7,.77) 46%, rgba(5,5,7,.17) 88%),
          linear-gradient(0deg, rgba(5,5,7,.94) 0%, transparent 43%, rgba(5,5,7,.38) 100%);
      }
      body.variant-right .content { left: auto; right: 76px; text-align: right; }
      body.variant-right .kicker { justify-content: flex-end; }
      body.variant-right .footer { flex-direction: row-reverse; }
      body.feed.variant-right .content { right: 62px; }

      body.compact h1 { font-size: 70px; }
      body.feed.compact h1 { font-size: 60px; }
    </style>
  </head>
  <body>
    <main class="creative">
      <img class="photo" id="photo" alt="" />
      <div class="shade"></div>
      <div class="pink-glow"></div>
      <div class="frame"></div>
      <header class="topbar">
        <div class="brand"><img src="../assets/img/logo-home.svg" alt="SparkFilmes" /></div>
        <div class="campaign">BLACK <b>FRIDAY</b></div>
      </header>
      <section class="content">
        <div class="kicker" id="kicker"></div>
        <h1 id="headline"></h1>
        <p class="subhead" id="subhead"></p>
      </section>
      <footer class="footer">
        <div class="cta" id="cta"></div>
        <div class="site">sparkfilmes.com.br</div>
      </footer>
    </main>
    <script>
      const ads = [
        {
          file: "01-planeje-agora.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Ainda dá tempo de produzir sua <em>Black Friday.</em>",
          subhead: "Conteúdo profissional para colocar sua campanha no ar.",
          cta: "Agende sua gravação",
          posStory: "58% center", posFeed: "58% center"
        },
        {
          file: "02-improviso.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Sua concorrência <em>já está gravando.</em>",
          subhead: "Não deixe sua produção de conteúdo para a última hora.",
          cta: "Grave com a Spark",
          posStory: "58% center", posFeed: "58% center"
        },
        {
          file: "03-uma-diaria.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Uma diária. <em>Sua campanha inteira.</em>",
          subhead: "Anúncios, reels e variações em uma só captação.",
          cta: "Monte seu pacote",
          posStory: "60% center", posFeed: "60% center", compact: true
        },
        {
          file: "04-autoridade.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "A oportunidade <em>é agora. Apareça.</em>",
          subhead: "Conteúdo profissional para transformar atenção em oportunidade.",
          cta: "Posicione sua marca",
          posStory: "64% center", posFeed: "64% center"
        },
        {
          file: "05-comercio.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Sem conteúdo, sua oferta <em>não chega longe.</em>",
          subhead: "Produção audiovisual para comércios, produtos e marcas locais.",
          cta: "Produza sua campanha",
          posStory: "63% center", posFeed: "63% center", compact: true
        },
        {
          file: "06-beleza.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Seu cliente está pronto. <em>Seu conteúdo também?</em>",
          subhead: "Grave agora o conteúdo que vai apresentar sua oferta.",
          cta: "Agende sua produção",
          posStory: "66% center", posFeed: "66% center"
        },
        {
          file: "07-urgencia.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Não deixe para gravar <em>na última hora.</em>",
          subhead: "Planejamento, captação e edição precisam de tempo.",
          cta: "Reserve sua data",
          posStory: "67% center", posFeed: "67% center"
        },
        {
          file: "08-bastidores.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Quem grava antes, <em>anuncia melhor.</em>",
          subhead: "Produza sua campanha com tempo para testar seus criativos.",
          cta: "Comece agora",
          posStory: "55% center", posFeed: "55% center", compact: true
        },
        {
          file: "09-gastronomia.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "Black Friday é <em>oportunidade de aparecer.</em>",
          subhead: "Conteúdo audiovisual para colocar sua oferta diante do cliente.",
          cta: "Coloque sua marca em cena",
          posStory: "60% center", posFeed: "60% center"
        },
        {
          file: "10-marca-em-cena.png",
          kicker: "Produção de conteúdo | Black Friday",
          headline: "A oportunidade passa. <em>O conteúdo fica.</em>",
          subhead: "Produza agora e use seus vídeos durante toda a campanha.",
          cta: "Peça um orçamento",
          posStory: "64% center", posFeed: "64% center", compact: true
        }
      ];

      const params = new URLSearchParams(location.search);
      const index = Math.min(ads.length, Math.max(1, Number(params.get("i")) || 1)) - 1;
      const format = params.get("format") === "feed" ? "feed" : "story";
      const ad = ads[index];
      document.body.classList.add(format);
      if (ad.compact) document.body.classList.add("compact");
      document.documentElement.style.setProperty("--photo-position", format === "feed" ? ad.posFeed : ad.posStory);
      document.getElementById("photo").src = `fontes/${ad.file}`;
      document.getElementById("kicker").textContent = ad.kicker;
      document.getElementById("headline").innerHTML = ad.headline;
      document.getElementById("subhead").textContent = ad.subhead;
      document.getElementById("cta").textContent = ad.cta;
    </script>
  </body>
</html>
